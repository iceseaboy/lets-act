name: App checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-and-server:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'codex/')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift core tests
        run: swift test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parser service tests
        run: node --test server/test/*.test.mjs
      - name: Verify generated project
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code ios/LetsAct.xcodeproj
  ios:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'codex/')
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [iPad, iPhone]
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: xcodebuild -project ios/LetsAct.xcodeproj -scheme LetsAct -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Choose a simulator
        id: simulator
        env:
          SIMULATOR_FAMILY: ${{ matrix.device }}
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json,os; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if os.environ["SIMULATOR_FAMILY"] in x["name"]))')
          echo "id=$DEVICE" >> "$GITHUB_OUTPUT"
      - name: UI tests
        run: xcodebuild -project ios/LetsAct.xcodeproj -scheme LetsAct -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -parallel-testing-enabled NO -derivedDataPath build -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results-${{ matrix.device }}
          path: |
            TestResults.xcresult
            screenshots
          if-no-files-found: ignore
